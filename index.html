<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>推し管理 - サポート</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #333;
      line-height: 1.7;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;

    h2 {

      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    a {
      color: #007aff;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #888;

<body>
  <div class="container">

    <h1>推し管理</h1>
    <div class="subtitle">サポートページ</div>

    <div class="card">
      <h2>アプリについて</h2>
      <p>
        「推し管理」は、推しの来店スケジュールや参加予定、
        収支などを仲間と共有・管理するためのアプリです。
      </p>
    </div>

    <div class="card">
      <h2>お問い合わせ</h2>
      <p>
        アプリの利用方法、不具合、ご要望などについては、
        下記メールアドレスまでお問い合わせください。
      </p>

      <p>
        <a href="mailto:support@oshisuke.jp">
          support@oshisuke.jp
        </a>
      </p>
    </div>

    <div class="card">
      <h2>お問い合わせの際のお願い</h2>
      <p>
        不具合についてお問い合わせいただく場合は、
        発生した画面や操作内容、端末の種類などを
        可能な範囲でお知らせください。
      </p>
    </div>

    <footer>
      © 推し管理
    </footer>

  </div>
